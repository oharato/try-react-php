services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/var/www/html:ro
    depends_on:
      - php
      - frontend
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    volumes:
      - ./backend:/var/www/html
    user: "1000:1000"
    depends_on:
      - mysql
  mysql:
    image: mysql:8.4
    environment:
      - MYSQL_ROOT_PASSWORD=reactphp
      - MYSQL_DATABASE=corpdesk
      - MYSQL_USER=corpdesk
      - MYSQL_PASSWORD=secret
    volumes:
      - mysql-data:/var/lib/mysql
  frontend:
    build:
      context: ./docker/frontend
      dockerfile: Dockerfile
    user: "1000:1000"
    volumes:
      - ./frontend:/app
    command: pnpm dev --host 0.0.0.0

volumes:
  mysql-data: